// Use settingsDir to anchor the relative path, ensuring it works regardless of where the build is started
def configFile = new File(settingsDir, "../capacitor.config.json")

if (!configFile.exists()) {
    throw new GradleException("Capacitor error: capacitor.config.json not found at " + configFile.absolutePath)
}

def config = new groovy.json.JsonSlurper().parseText(configFile.text)

// Include the core Capacitor Android library
include ':capacitor-android'
project(':capacitor-android').projectDir = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')

// Automatically include Capacitor plugins found in node_modules
def packageJsonFile = new File(settingsDir, "../package.json")
if (packageJsonFile.exists()) {
    def packageJson = new groovy.json.JsonSlurper().parseText(packageJsonFile.text)
    def deps = packageJson.dependencies ?: [:]

    deps.each { name, version ->
        def pluginDir = new File(settingsDir, "../node_modules/${name}/android")
        if (pluginDir.exists()) {
            def projectTag = ":" + name.replaceAll("/", "-").replaceAll("@", "")
            include projectTag
            project(projectTag).projectDir = pluginDir
        }
    }
}